<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Do You See? - Faina's English</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #f0f8ff;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .teacher-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            border: 2px solid #34495e;
        }

        .card {
            background: #ffffff;
            border: 5px solid #2980b9;
            border-radius: 25px;
            padding: 25px;
            width: 95%;
            max-width: 800px;
            box-shadow: 10px 10px 0px #2980b9;
            text-align: center;
            position: relative;
        }

        .big-question {
            font-size: 2.5rem;
            color: #e67e22;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 1px 1px 0px #d35400;
        }

        .reveal-area {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
        }

        .english-sentence {
            font-size: 2.2rem;
            color: #2c3e50;
            font-weight: bold;
            display: none;
        }

        .ukr-hint {
            font-size: 1.4rem;
            color: #7f8c8d;
            display: none;
            margin-top: 5px;
        }

        .teacher-prompt {
            font-size: 1.5rem;
            color: #8e44ad;
            font-style: italic;
            display: none;
        }

        .show-btn {
            font-family: inherit;
            font-size: 1.2rem;
            padding: 10px 20px;
            background-color: #f1c40f;
            color: #2c3e50;
            border: 3px solid #f39c12;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0px 5px 0px #f39c12;
            margin-top: 10px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .show-btn:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px #f39c12;
        }

        .pictures-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .picture-box {
            border: 4px dashed #bdc3c7;
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            background-color: #f8f9fa;
            font-size: 3rem;
            line-height: 1.3;
            transition: all 0.2s;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .picture-box:hover {
            border-color: #2980b9;
            background-color: #eaf2f8;
            transform: scale(1.02);
        }

        .empty-box {
            font-size: 1.6rem;
            color: #95a5a6;
            font-style: italic;
        }

        .correct {
            background-color: #2ecc71 !important;
            border-color: #27ae60 !important;
            border-style: solid !important;
            color: white;
        }

        .wrong {
            background-color: #e74c3c !important;
            border-color: #c0392b !important;
            border-style: solid !important;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .result-screen h2 {
            font-size: 3rem;
            color: #d35400;
        }

        .restart-btn {
            font-family: inherit;
            font-size: 1.8rem;
            padding: 15px 30px;
            margin-top: 20px;
            border: 4px solid #27ae60;
            border-radius: 15px;
            background-color: #2ecc71;
            color: white;
            cursor: pointer;
            box-shadow: 0px 6px 0px #27ae60;
        }

        .restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #27ae60;
        }

        /* Teacher mode specific styles */
        body.teacher-mode .english-sentence { display: none !important; }
        body.teacher-mode .ukr-hint { display: none !important; }
        body.teacher-mode .teacher-prompt { display: block !important; }
        body.teacher-mode .show-btn { display: none !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="progress">Question 1 / 8</div>
        
        <label class="teacher-toggle">
            <input type="checkbox" id="teacher-mode-checkbox" style="width: 20px; height: 20px;">
            <span>👩‍🏫 Teacher Mode</span>
        </label>
        
        <div class="stars" id="stars-display" style="color: #f1c40f; text-shadow: 1px 1px 0px #d35400;">⭐ 0</div>
    </div>

    <div class="card" id="quiz-card">
        <div class="big-question">What do you see?</div>
        
        <div class="reveal-area">
            <div class="english-sentence" id="sentence-text"></div>
            <div class="ukr-hint" id="ukr-text"></div>
            <div class="teacher-prompt" id="teacher-text"></div>
            
            <button class="show-btn" id="show-btn" onclick="revealSentence()">Show Sentence 👀</button>
        </div>

        <div class="pictures-container" id="pictures-container">
            <!-- Picture boxes injected here -->
        </div>
    </div>

    <div class="card result-screen" id="result-screen">
        <h2 id="result-title">Awesome!</h2>
        <div style="font-size: 4rem; margin: 20px 0;">🎉🎈🚀</div>
        <p id="result-text" style="font-size: 1.5rem;"></p>
        <button class="restart-btn" onclick="startGame()">Play Again! 🔄</button>
    </div>

    <script>
        const questions = [
            { english: "I see three apples.", ukrainian: "(Я бачу три яблука)", options: ["🍎🍎🍎", "🍎", "🍎🍎🍎🍎🍎"], answerIndex: 0 },
            { english: "I see zero cats.", ukrainian: "(Я бачу нуль котів - їх немає!)", options: ["🐱🐱", "(Нічого немає)", "🐱"], answerIndex: 1 },
            { english: "I see five stars.", ukrainian: "(Я бачу п'ять зірок)", options: ["⭐⭐⭐", "⭐⭐⭐⭐⭐⭐", "⭐⭐⭐⭐⭐"], answerIndex: 2 },
            { english: "I see one big dog.", ukrainian: "(Я бачу одного великого пса)", options: ["🐶🐶🐶", "🐶", "(Нічого немає)"], answerIndex: 1 },
            { english: "I see eight balloons.", ukrainian: "(Я бачу вісім кульок)", options: ["🎈🎈🎈🎈🎈🎈", "🎈🎈🎈🎈🎈🎈🎈🎈", "🎈🎈🎈🎈"], answerIndex: 1 },
            { english: "I see zero pizzas.", ukrainian: "(Я бачу нуль піц - сумно)", options: ["🍕🍕", "🍕", "(Порожньо)"], answerIndex: 2 },
            { english: "I see two frogs.", ukrainian: "(Я бачу дві жаби)", options: ["🐸🐸", "🐸🐸🐸", "🐸"], answerIndex: 0 },
            { english: "I see ten cars.", ukrainian: "(Я бачу десять машин)", options: ["🚗🚗🚗🚗🚗", "🚗🚗🚗🚗🚗🚗🚗", "🚗🚗🚗🚗🚗🚗🚗🚗🚗🚗"], answerIndex: 2 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let canClick = true;
        let shuffledQuestions = [];

        const sentenceText = document.getElementById('sentence-text');
        const ukrText = document.getElementById('ukr-text');
        const teacherText = document.getElementById('teacher-text');
        const showBtn = document.getElementById('show-btn');
        const picturesContainer = document.getElementById('pictures-container');
        const progressText = document.getElementById('progress');
        const starsDisplay = document.getElementById('stars-display');
        const quizCard = document.getElementById('quiz-card');
        const resultScreen = document.getElementById('result-screen');
        const teacherModeCheckbox = document.getElementById('teacher-mode-checkbox');

        teacherModeCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.body.classList.add('teacher-mode');
            } else {
                document.body.classList.remove('teacher-mode');
            }
        });

        function startGame() {
            shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
            currentQuestion = 0;
            score = 0;
            quizCard.style.display = 'block';
            resultScreen.style.display = 'none';
            loadQuestion();
        }

        function loadQuestion() {
            canClick = true;
            const q = shuffledQuestions[currentQuestion];
            
            progressText.innerText = `Question ${currentQuestion + 1} / ${shuffledQuestions.length}`;
            starsDisplay.innerText = `⭐ ${score}`;
            
            // Reset the reveal area
            sentenceText.style.display = 'none';
            ukrText.style.display = 'none';
            showBtn.style.display = 'inline-block';
            
            sentenceText.innerText = `"${q.english}"`;
            ukrText.innerText = q.ukrainian;
            teacherText.innerText = `Ask Faina: "What do you see?"`;
            
            picturesContainer.innerHTML = '';
            
            q.options.forEach((option, index) => {
                const box = document.createElement('div');
                box.className = 'picture-box';
                
                if (option.includes("Нічого") || option.includes("Порожньо")) {
                    box.innerHTML = `<span class="empty-box">${option}</span>`;
                } else {
                    box.innerText = option;
                }
                
                box.onclick = () => checkAnswer(index, q.answerIndex, box);
                picturesContainer.appendChild(box);
            });

            // If in teacher mode, don't show the sentence button
            if (document.body.classList.contains('teacher-mode')) {
                showBtn.style.display = 'none';
            }
        }

        function revealSentence() {
            sentenceText.style.display = 'block';
            ukrText.style.display = 'block';
            showBtn.style.display = 'none';
        }

        function checkAnswer(selected, correct, boxElement) {
            if (!canClick) return;
            canClick = false;

            if (selected === correct) {
                boxElement.classList.add('correct');
                score++;
                starsDisplay.innerText = `⭐ ${score}`;
                playSound(800, 0.15);
                
                setTimeout(() => {
                    nextQuestion();
                }, 900);
            } else {
                boxElement.classList.add('wrong');
                playSound(150, 0.3);
                
                Array.from(picturesContainer.children).forEach((child, idx) => {
                    if (idx === correct) {
                        setTimeout(() => child.classList.add('correct'), 300);
                    }
                });

                setTimeout(() => {
                    nextQuestion();
                }, 2000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < shuffledQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizCard.style.display = 'none';
            resultScreen.style.display = 'block';
            
            document.getElementById('result-text').innerText = `You found ${score} out of ${shuffledQuestions.length} correct!`;
            
            if (score === shuffledQuestions.length) {
                document.getElementById('result-title').innerText = "PERFECT SCORE! 👑";
            } else if (score >= 5) {
                document.getElementById('result-title').innerText = "Great job! 🌟";
            } else {
                document.getElementById('result-title').innerText = "Good try! Let's play again! 💪";
            }
        }

        function playSound(freq, duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = freq > 400 ? 'sine' : 'square';
                osc.frequency.value = freq;
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        startGame();
    </script>
</body>
</html>
